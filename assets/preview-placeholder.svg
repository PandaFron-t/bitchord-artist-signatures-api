<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="550" viewBox="0 0 1400 550" role="img" aria-labelledby="t d">
<title id="t">Preview screenshots placeholder</title>
<desc id="d">Three placeholders for real BitChord artist-profile screenshots showing artist signatures.</desc>
